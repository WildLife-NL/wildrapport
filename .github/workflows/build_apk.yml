name: Build APK

on:
  push:
    branches:
      - main

jobs:
  # ============================================================
  # TEST
  # ============================================================
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Create TEST .env
        run: |
          echo "DEV_BASE_URL=${{ secrets.TEST_API_KEY }}" > .env
          echo "DEV_DEBUG_TOOLS=false" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate test mocks
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test --coverage

  # ============================================================
  # ANALYZE
  # ============================================================
  analyze:
    needs: test
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Create TEST .env
        run: |
          echo "DEV_BASE_URL=${{ secrets.TEST_API_KEY }}" > .env
          echo "DEV_DEBUG_TOOLS=false" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

  # ============================================================
  # BUMP VERSION (YY.MM.DD+YYYYMMDD) in pubspec.yaml
  # ============================================================
  bump-version:
    needs: analyze
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_date: ${{ steps.version.outputs.release_date }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from today
        id: version
        run: |
          VERSION_NAME=$(date +%y.%m.%d)
          BUILD_NUMBER=$(date +%Y%m%d)
          RELEASE_DATE=$(date +%Y-%m-%d)

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "release_date=${RELEASE_DATE}" >> "$GITHUB_OUTPUT"

          sed -i "s/^version:.*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "Updated pubspec.yaml → ${VERSION_NAME}+${BUILD_NUMBER}"
          grep '^version:' pubspec.yaml

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          if git diff --staged --quiet; then
            echo "pubspec.yaml already at today's version — nothing to commit"
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.build_number }}"
            git push
          fi

  # ============================================================
  # BUILD TEST APK
  # ============================================================
  build-test-apk:
    needs: bump-version
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Create TEST .env
        run: |
          echo "DEV_BASE_URL=${{ secrets.TEST_API_KEY }}" > .env
          echo "DEV_DEBUG_TOOLS=false" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build TEST APK
        env:
          VERSION_NAME: ${{ needs.bump-version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.bump-version.outputs.build_number }}
        run: |
          flutter build apk --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${BUILD_NUMBER}"

      - name: Rename TEST APK
        env:
          VERSION_NAME: ${{ needs.bump-version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.bump-version.outputs.build_number }}
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/wildrapport-test-${VERSION_NAME}-${BUILD_NUMBER}.apk

      - name: Upload TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: wildrapport-test-apk
          path: build/app/outputs/flutter-apk/wildrapport-test-*.apk

  # ============================================================
  # BUILD LIVE APK
  # ============================================================
  build-live-apk:
    needs: bump-version
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Create LIVE .env
        run: |
          echo "DEV_BASE_URL=${{ secrets.LIVE_API_KEY }}" > .env
          echo "DEV_DEBUG_TOOLS=false" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build LIVE APK
        env:
          VERSION_NAME: ${{ needs.bump-version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.bump-version.outputs.build_number }}
        run: |
          flutter build apk --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${BUILD_NUMBER}"

      - name: Rename LIVE APK
        env:
          VERSION_NAME: ${{ needs.bump-version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.bump-version.outputs.build_number }}
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/wildrapport-live-${VERSION_NAME}-${BUILD_NUMBER}.apk

      - name: Upload LIVE APK
        uses: actions/upload-artifact@v4
        with:
          name: wildrapport-live-apk
          path: build/app/outputs/flutter-apk/wildrapport-live-*.apk

  # ============================================================
  # ONE GitHub Release with BOTH APKs (shows on repo homepage)
  # ============================================================
  release:
    needs:
      - bump-version
      - build-test-apk
      - build-live-apk
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download TEST APK
        uses: actions/download-artifact@v4
        with:
          name: wildrapport-test-apk
          path: release-apks

      - name: Download LIVE APK
        uses: actions/download-artifact@v4
        with:
          name: wildrapport-live-apk
          path: release-apks

      - name: List APKs
        run: ls -lh release-apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump-version.outputs.version_name }}-${{ needs.bump-version.outputs.build_number }}
          name: WildRapport ${{ needs.bump-version.outputs.version_name }}
          body: |
            Automatische release van ${{ needs.bump-version.outputs.release_date }}.

            - **Versie:** `${{ needs.bump-version.outputs.version_name }}+${{ needs.bump-version.outputs.build_number }}`
            - **Commit:** `${{ github.sha }}`

            ### Downloads
            - `wildrapport-test-…apk` — TEST API
            - `wildrapport-live-…apk` — LIVE API
          make_latest: true
          files: release-apks/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
